<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forja de Sprites</title>
  <meta name="description" content="Creador modular de personajes y sprites 2D para novelas visuales y juegos de pixel art.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◆</span>
      <h1>Forja de Sprites</h1>
    </div>
    <label class="engine">Motor
      <select id="engine" aria-label="Motor de dibujo">
        <option value="sdf" selected>Anatómico SDF (nuevo)</option>
        <option value="anat">Anatómico clásico</option>
        <option value="gen">Generado (ligero)</option>
        <option value="mod">Modular CC0 (piezas combinables)</option>
        <option value="vrm">Modelo VRM (anime 3D)</option>
        <option value="lpc">Hoja LPC (pixel art)</option>
      </select>
    </label>
    <div class="mode" role="tablist" aria-label="Modo">
      <button role="tab" data-mode="vn" class="active">Novela visual</button>
      <button role="tab" data-mode="pixel">Juego · pixel art</button>
    </div>
    <div class="actions">
      <input id="charName" class="name" type="text" value="Personaje" aria-label="Nombre del personaje" maxlength="40">
      <button id="btnRandom" title="Personaje aleatorio">🎲 Aleatorio</button>
      <button id="btnSave" title="Guardar personaje (.json)">💾 Guardar</button>
      <label class="btn" title="Cargar personaje (.json)">📂 Cargar<input id="fileLoad" type="file" accept=".json,application/json" hidden></label>
    </div>
  </header>

  <main class="layout">
    <aside class="panel editor" id="editor" aria-label="Editor de personaje"></aside>

    <section class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="view"></canvas>
      </div>
      <div class="anim-bar">
        <span class="bar-label">Vista</span>
        <div class="chips" id="viewChips"></div>
      </div>
      <div class="anim-bar">
        <button id="btnPlay" class="icon" title="Reproducir / pausar (espacio)" aria-label="Reproducir o pausar">❚❚</button>
        <div class="chips" id="animChips"></div>
        <span class="frame-info" id="frameInfo">1/1</span>
      </div>
    </section>

    <aside class="panel output" aria-label="Salida y exportación">
      <div id="vnOptions">
        <h2>Novela visual</h2>
        <label class="row">Encuadre
          <select id="vnFrame">
            <option value="full">Cuerpo completo</option>
            <option value="bust">Busto</option>
          </select>
        </label>
        <label class="row">Resolución
          <select id="vnScale">
            <option value="1">600 × 1000</option>
            <option value="2" selected>1200 × 2000</option>
            <option value="3">1800 × 3000</option>
          </select>
        </label>
        <label class="row">Líneas
          <select id="lineMode">
            <option value="colored">Del color de la pieza</option>
            <option value="dark">Oscuras</option>
          </select>
        </label>
        <label class="row">Grosor de línea
          <input id="lineWidth" type="range" min="0" max="2" step="0.1" value="1">
        </label>
        <div class="export">
          <button data-export="vn-png">PNG de la pose actual</button>
          <button data-export="vn-expr">Pack de expresiones (ZIP + Ren'Py)</button>
          <button data-export="vn-sheet">Hoja de animación (ZIP)</button>
        </div>
      </div>

      <div id="pxOptions" hidden>
        <h2>Juego · pixel art</h2>
        <label class="row">Tipo
          <select id="pxType">
            <option value="sprite">Sprite de juego (cuerpo entero)</option>
            <option value="portrait">Retrato de novela visual (busto)</option>
          </select>
        </label>
        <label class="row" id="pxPortraitRow" hidden>Tamaño del retrato
          <select id="pxPortraitSize">
            <option>96x120</option>
            <option selected>128x160</option>
            <option>160x200</option>
            <option>200x250</option>
          </select>
        </label>
        <label class="row" id="pxSizeRow">Tamaño del fotograma
          <select id="pxSize">
            <option>32x32</option>
            <option>32x48</option>
            <option selected>48x64</option>
            <option>64x64</option>
            <option>64x96</option>
            <option>96x128</option>
          </select>
        </label>
        <label class="check" id="pxChibiRow"><input id="pxChibi" type="checkbox" checked> Proporciones chibi</label>
        <label class="check"><input id="pxOutline" type="checkbox" checked> Contorno exterior</label>
        <label class="check"><input id="pxInner" type="checkbox" checked> Líneas interiores</label>
        <label class="check" id="pxDirsRow"><input id="pxDirs" type="checkbox" checked> 4 direcciones (abajo, izquierda, derecha, arriba)</label>
        <label class="row">Escala al exportar
          <select id="pxExportScale">
            <option value="1" selected>×1 (tamaño real)</option>
            <option value="2">×2</option>
            <option value="4">×4</option>
          </select>
        </label>
        <div class="export">
          <button data-export="px-png">PNG del fotograma</button>
          <button data-export="px-sheet">Hoja de sprites + JSON (ZIP)</button>
          <button data-export="px-expr">Pack de expresiones pixel (ZIP + Ren'Py)</button>
        </div>
      </div>

      <h3>Animaciones a exportar</h3>
      <div class="anim-checks" id="animChecks"></div>
      <p class="hint">Todo funciona en el navegador, sin tarjeta gráfica dedicada ni conexión a internet.</p>
      <p class="status" id="status" role="status"></p>
    </aside>
  </main>

  <script src="js/core/util.js"></script>
  <script src="js/core/volume.js"></script>
  <script src="js/core/skeleton.js"></script>
  <script src="js/core/registry.js"></script>
  <script src="js/core/animations.js"></script>
  <script src="js/core/renderer.js"></script>
  <script src="js/core/exporter.js"></script>
  <script src="js/parts/body.js"></script>
  <script src="js/parts/face.js"></script>
  <script src="js/parts/hair.js"></script>
  <script src="js/parts/clothes.js"></script>
  <script src="js/parts/accessories.js"></script>
  <script src="vendor/vrm-bundle.js"></script>
  <script src="js/vrm/recolor.js"></script>
  <script src="js/vrm/engine.js"></script>
  <script src="js/mod/engine.js"></script>
  <script src="js/lpc/lpc.js"></script>
  <script src="js/anat/canon.js"></script>
  <script src="js/anat/math.js"></script>
  <script src="js/anat/body.js"></script>
  <script src="js/anat/rig.js"></script>
  <script src="js/anat/shapes.js"></script>
  <script src="js/anat/head.js"></script>
  <script src="js/anat/render.js"></script>
  <script src="js/anat/parts.js"></script>
  <script src="js/anat/validate.js"></script>
  <script src="js/sdf/core.js"></script>
  <script src="js/sdf/build.js"></script>
  <script src="js/sdf/march.js"></script>
  <script src="js/sdf/gl.js"></script>
  <script src="js/sdf/compose.js"></script>
  <script src="js/sdf/face.js"></script>
  <script src="js/sdf/hair.js"></script>
  <script src="js/sdf/clothes.js"></script>
  <script src="js/sdf/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
